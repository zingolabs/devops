apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ztest-ci-preflight
rules:
  # `ztest cluster check` reads each role's `ztest.io/rules-hash` annotation to tell a current
  # role from a stale one, and probes both identities. Scoped to those two objects by name:
  # no list, no watch, no other role, and nothing a run itself uses.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["ztest-orchestrator", "ztest-driver"]
    verbs: ["get"]
