# Retain — golden chain fixtures (content = the artifact)
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: topolvm-snapshot
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: topolvm.io
deletionPolicy: Retain
---
# Delete — ztest drops its snapshot per run (Retain → one orphaned thin-pool LV each)
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ztest-snapshot
driver: topolvm.io
deletionPolicy: Delete
