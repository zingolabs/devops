# Golden mainnet zebra RPC on the tailnet: upstream for off-cluster zaino (infra/zaino)
#
# - separate Service (zcash-stack chart has no zebra.service.annotations)
# - zebra RPC = no cookie auth (chart-hardcoded) → tailnet ACL = only access control
# - P2P not here (proxy pod = hard NAT → DERP-relayed; see p2p.yaml)
apiVersion: v1
kind: Service
metadata:
  name: zebra-tailnet
  namespace: golden-mainnet
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: golden-mainnet-zebra
spec:
  type: ClusterIP
  selector:
    app: zebra
  ports:
    - name: rpc
      port: 8232
      targetPort: 8232
      protocol: TCP
