# Golden mainnet zebra P2P for ztest's mainnet zebras: `tekau.vaquita-altair.ts.net:30233`
#
# - NodePort on the node's own tailscaled (direct path) over the operator proxy (hard NAT → DERP;
#   zebra = 1 request in flight per peer, so relay RTT starves checkpoint sync)
# - `Local` keeps each client's tailnet IP (`Cluster` SNATs all to the node gateway → zebra's
#   1-connection-per-IP limit = one client for everyone); zebra-0 pinned to tekau by its volume
apiVersion: v1
kind: Service
metadata:
  name: zebra-p2p
  namespace: golden-mainnet
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: zebra
  ports:
    - name: p2p
      port: 8233
      targetPort: 8233
      nodePort: 30233
      protocol: TCP
