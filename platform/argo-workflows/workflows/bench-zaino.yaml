# Bench Zaino Sync Engine
# Builds sync-bench from a git ref, pushes to registry, then runs a k8s Job
# on the node holding the shared Zebra state cache, with LMDB + OTLP tracing.
#
# One binary, three modes (`bench-mode`): `provision` drains the provisioner
# (the read-path ceiling), `sync` runs the full provisioner → engine → LMDB
# pipeline, `both` runs the two over one window and attributes the bottleneck.
# `bench-adapter` picks the source: `readstate` opens the mounted state DB,
# `rpc` reaches the validator's JSON-RPC (`zebra-rpc-addr`).
#
# Usage:
#   argo submit --from workflowtemplate/bench-zaino -n argo \
#     -p ref=feat/runtime-on-dev
#
#   argo submit --from workflowtemplate/bench-zaino -n argo \
#     -p ref=feat/parallel-merge -p block-count=100000 -p tag=par-merge
#
#   # provisioner-only read path over the whole chain (no engine/write):
#   argo submit --from workflowtemplate/bench-zaino -n argo \
#     -p ref=feat/runtime-on-dev -p bench-mode=provision \
#     -p block-count=3490000 -p tag=provision-full
#
#   # the same over JSON-RPC instead of the state DB:
#   argo submit --from workflowtemplate/bench-zaino -n argo \
#     -p ref=feat/runtime-on-dev -p bench-mode=provision -p bench-adapter=rpc \
#     -p block-count=3490000 -p tag=provision-full-rpc
#
# An empty block-count means "to the source's tip".
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: bench-zaino
  namespace: argo
spec:
  entrypoint: bench
  serviceAccountName: snapshot-workflow
  arguments:
    parameters:
      - name: ref
        value: dev
      - name: block-count
        value: "100000"
      - name: concurrency
        value: "16"
      - name: batch-size
        value: "1000"
      - name: rust-log
        value: "sync_bench=info,zaino_sync=trace"
      # The bench binary. There is one; the mode selects what it measures.
      - name: binary
        value: "sync-bench"
      # provision | sync | both (see the header). Empty keeps the binary's
      # default (sync).
      - name: bench-mode
        value: "sync"
      # readstate | rpc. Empty keeps the binary's default (readstate).
      - name: bench-adapter
        value: "readstate"
      # The validator's JSON-RPC, for `bench-adapter=rpc`.
      - name: zebra-rpc-addr
        value: "zebra.golden-zebra-state.svc:8232"
      - name: tag
        value: ""
      - name: target-namespace
        value: golden-mainnet
      - name: node
        value: tekau
      # Zebra cache directory on the node: the shared read-only state cache
      # the golden-zebra-state validator maintains, the same one state-mode
      # deploys read. A stable path, unlike a pod's CSI mount. Override to
      # bench against another zebra (a newer release syncing on its own PVC).
      - name: zebra-hostpath
        value: "/srv/zebra-state-cache-mainnet"

  templates:
    - name: bench
      inputs:
        parameters:
          - name: ref
            default: dev
          - name: block-count
            default: "100000"
          - name: concurrency
            default: "16"
          - name: batch-size
            default: "1000"
          - name: rust-log
            default: "sync_bench=info,zaino_sync=trace"
          - name: binary
            default: "sync-bench"
          - name: bench-mode
            default: "sync"
          - name: bench-adapter
            default: "readstate"
          - name: zebra-rpc-addr
            default: "zebra.golden-zebra-state.svc:8232"
          - name: tag
            default: ""
          - name: target-namespace
            default: golden-mainnet
          - name: node
            default: tekau
          - name: zebra-hostpath
            default: "/var/lib/kubelet/pods/cc3f278f-277c-4bcb-84e1-edbf8699d01d/volumes/kubernetes.io~csi/pvc-787fcbe1-bea1-49be-9daf-9953a3ea8464/mount"
      steps:
        - - name: resolve-tag
            template: resolve-tag
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: tag
                  value: "{{inputs.parameters.tag}}"
        - - name: build-image
            template: buildkit
            arguments:
              parameters:
                - name: ref
                  value: "{{inputs.parameters.ref}}"
                - name: destination
                  value: "zingodevops/sync-bench:{{steps.resolve-tag.outputs.parameters.tag}}"
        - - name: run-bench
            template: run-bench
            arguments:
              parameters:
                - name: image
                  value: "zingodevops/sync-bench:{{steps.resolve-tag.outputs.parameters.tag}}"
                - name: block-count
                  value: "{{inputs.parameters.block-count}}"
                - name: concurrency
                  value: "{{inputs.parameters.concurrency}}"
                - name: batch-size
                  value: "{{inputs.parameters.batch-size}}"
                - name: rust-log
                  value: "{{inputs.parameters.rust-log}}"
                - name: binary
                  value: "{{inputs.parameters.binary}}"
                - name: bench-mode
                  value: "{{inputs.parameters.bench-mode}}"
                - name: bench-adapter
                  value: "{{inputs.parameters.bench-adapter}}"
                - name: zebra-rpc-addr
                  value: "{{inputs.parameters.zebra-rpc-addr}}"
                - name: target-namespace
                  value: "{{inputs.parameters.target-namespace}}"
                - name: node
                  value: "{{inputs.parameters.node}}"
                - name: zebra-hostpath
                  value: "{{inputs.parameters.zebra-hostpath}}"
                - name: tag
                  value: "{{steps.resolve-tag.outputs.parameters.tag}}"

    - name: resolve-tag
      inputs:
        parameters:
          - name: ref
          - name: tag
      container:
        image: busybox
        command: [sh, -c]
        args:
          - |
            TAG="{{inputs.parameters.tag}}"
            if [ -z "$TAG" ]; then
              # Derive tag from ref: sanitize + truncate
              TAG=$(echo "{{inputs.parameters.ref}}" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-48)
            fi
            echo "Resolved tag: $TAG"
            echo -n "$TAG" > /tmp/tag
      outputs:
        parameters:
          - name: tag
            valueFrom:
              path: /tmp/tag

    - name: buildkit
      inputs:
        parameters:
          - name: ref
          - name: destination
      container:
        image: moby/buildkit:v0.21.1-rootless
        env:
          - name: BUILDKITD_FLAGS
            value: --oci-worker-no-process-sandbox
        command:
          - buildctl-daemonless.sh
        args:
          - build
          - --frontend
          - gateway.v0
          - --opt
          - source=docker/dockerfile
          - --opt
          - context=https://github.com/zingolabs/zaino.git#{{inputs.parameters.ref}}
          - --opt
          - filename=bench/sync-bench/Containerfile
          - --output
          - type=image,name={{inputs.parameters.destination}},push=true
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
        volumeMounts:
          - name: docker-config
            mountPath: /home/user/.docker
            readOnly: true
          - name: buildkit-cache
            mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: docker-config
          secret:
            secretName: docker-registry-creds
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: buildkit-cache
          persistentVolumeClaim:
            claimName: buildkit-cache

    - name: run-bench
      inputs:
        parameters:
          - name: image
          - name: block-count
          - name: concurrency
          - name: batch-size
          - name: rust-log
          - name: binary
          - name: bench-mode
          - name: bench-adapter
          - name: zebra-rpc-addr
          - name: target-namespace
          - name: node
          - name: zebra-hostpath
          - name: tag
      resource:
        action: create
        successCondition: status.succeeded > 0
        failureCondition: status.failed > 0
        manifest: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: bench-{{inputs.parameters.tag}}
            namespace: {{inputs.parameters.target-namespace}}
            labels:
              app: zaino-sync-bench
          spec:
            activeDeadlineSeconds: 86400
            ttlSecondsAfterFinished: 14400
            template:
              spec:
                restartPolicy: Never
                nodeSelector:
                  kubernetes.io/hostname: {{inputs.parameters.node}}
                containers:
                - name: bench
                  image: {{inputs.parameters.image}}
                  # The binary is fully env-driven (clap `env` fallbacks): mode,
                  # adapter, window, concurrency and batch all arrive below.
                  command: ["{{inputs.parameters.binary}}"]
                  env:
                    - name: ZEBRA_STATE_DIR
                      value: /zebra-state
                    - name: ZAINO_DB_PATH
                      value: /data/zaino-bench
                    - name: SYNC_BLOCKS
                      value: "{{inputs.parameters.block-count}}"
                    - name: SYNC_CONCURRENCY
                      value: "{{inputs.parameters.concurrency}}"
                    - name: SYNC_BATCH
                      value: "{{inputs.parameters.batch-size}}"
                    - name: RUST_LOG
                      value: "{{inputs.parameters.rust-log}}"
                    - name: ZAINO_LOG_JSON
                      value: "1"
                    - name: OTEL_EXPORTER_OTLP_ENDPOINT
                      value: http://tempo.monitoring.svc:4317
                    - name: BENCH_MODE
                      value: "{{inputs.parameters.bench-mode}}"
                    - name: BENCH_ADAPTER
                      value: "{{inputs.parameters.bench-adapter}}"
                    - name: ZEBRA_RPC_ADDR
                      value: "{{inputs.parameters.zebra-rpc-addr}}"
                  volumeMounts:
                    - mountPath: /zebra-state
                      name: zebra-state
                      readOnly: true
                    - mountPath: /data
                      name: bench-data
                volumes:
                - hostPath:
                    path: {{inputs.parameters.zebra-hostpath}}
                    type: Directory
                  name: zebra-state
                - emptyDir:
                    sizeLimit: 300Gi
                  name: bench-data
