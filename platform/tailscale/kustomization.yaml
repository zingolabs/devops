apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

resources:
  - namespace.yaml

helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.94.2
    releaseName: tailscale
    namespace: tailscale
    valuesInline:
      # OAuth credentials from pre-created secret 'operator-oauth'
      # with keys: client_id, client_secret

      # API-server proxy: CI reaches k8s as its tailnet identity, so no kube token
      # is ever minted or stored in GitHub. Grant lives in machines/tailscale/policy.hujson
      # ("tailscale.com/cap/kubernetes" -> impersonate group ztest-ci); the group is
      # bound to ztest's own run role by platform/ztest-ci.
      apiServerProxyConfig:
        mode: "true"
