apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grpc-funnel.fullname" . }}-nginx
  labels:
    {{- include "grpc-funnel.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      error_log  /dev/stderr info;
      server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        location / {
          grpc_pass grpc://{{ required "grpc-funnel: .Values.backend is required" .Values.backend }};
          grpc_read_timeout 3600s;
          grpc_send_timeout 3600s;
        }
      }
    }
