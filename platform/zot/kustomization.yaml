apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zot

helmCharts:
  - name: zot
    repo: https://zotregistry.dev/helm-charts
    version: 0.1.122
    releaseName: zot
    namespace: zot
    valuesFile: values.yaml
    # kustomize inflates helm hooks as plain manifests (ArgoCD would run the test Pods as workloads)
    skipTests: true
