authentik:
  log_level: info
  # Secret is provided via existingSecret (SealedSecret)
  existingSecret:
    secretName: authentik-secrets
  postgresql:
    host: "authentik-postgresql"
    name: authentik
    user: authentik
    port: 5432

blueprints:
  configMaps:
    - authentik-blueprints

server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: tailscale
    hosts:
      - authentik
    tls:
      - hosts:
          - authentik
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secrets
    secretKeys:
      userPasswordKey: postgresql-password
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    extendedConfiguration: |
      max_connections = 100
