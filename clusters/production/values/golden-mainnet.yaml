ingress:
  enabled: false

zebra:
  enabled: true
  name: zebra
  testnet: false
  replicas: 1
  image:
    tag: "6.3.0"
    hash: ""
  storageClassName: topolvm-thin
  volumes:
    data:
      size: 350Gi
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    memory: 24Gi
  service:
    # Expose zebra P2P (8233) in-cluster so golden-zebra-state can peer with it.
    p2p: true
  # Tailnet P2P clients (ztest zebras, via the zebra-p2p NodePort) arrive from few IPs; the
  # default of 1 would serve one of them at a time. Needs zcash-stack >= 0.0.26.
  maxConnectionsPerIp: 8

zaino:
  enabled: true
  name: zaino
  replicas: 1
  rpcService: zebra
  service:
    type: ClusterIP
    port: 8137
    annotations:
      tailscale.com/expose: "true"
  storageClassName: topolvm-thin
  image:
    repository: zingodevops/zaino
    tag: 0.9.0-no-tls
    hash: ""
    pullPolicy: IfNotPresent
  config:
    dbSize: 160
  logging:
    format: json
    color: "false"
    level: "zaino=trace"
  volumes:
    data:
      size: 200Gi
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    memory: 32Gi

lightwalletd:
  enabled: false

zcashd:
  enabled: false
